name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.generate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate tag
        id: generate
        run: |
          DATE=$(date +'%Y%m%d')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=v${DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.generate.outputs.tag }}
          git push origin ${{ steps.generate.outputs.tag }}

  build:
    needs: generate-tag
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: AutoInput
            asset_name: 自动输入工具-linux
          - os: macos-latest
            artifact_name: AutoInput
            asset_name: 自动输入工具-macos
          - os: windows-latest
            artifact_name: AutoInput.exe
            asset_name: 自动输入工具-windows.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyautogui pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "AutoInput" input.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}*

  release:
    needs: [generate-tag, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/ -R

      - name: Prepare release files
        run: |
          mkdir release
          cp artifacts/自动输入工具-linux/AutoInput release/AutoInput-linux
          cp artifacts/自动输入工具-macos/AutoInput release/AutoInput-macos
          cp artifacts/自动输入工具-windows.exe/AutoInput.exe release/AutoInput-windows.exe
          chmod +x release/AutoInput-linux release/AutoInput-macos

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.generate-tag.outputs.tag }}
          name: Release ${{ needs.generate-tag.outputs.tag }}
          generate_release_notes: true
          files: |
            release/AutoInput-linux
            release/AutoInput-macos
            release/AutoInput-windows.exe